<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="level3.css">
  <title>Level 3 </title>
  
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card" style="max-width: 32rem; width: 100%;">
      <span class="badge text-bg-primary position-absolute top-0 start-0 m-3" id="levelBadge" style="max-width: 4rem;">Level 3</span>
      
      <div class="card-body pt-5 mt-2">  
        <h2 class="card-title text-center fw-semibold">Web Dev Mini-Quest</h2>
        <hr class="my-3">
        
        <p class="card-text fs-5 text-center" id="levelText">
          🔰 Current Level: <span id="levelNumber">3</span> / 6
        </p>
        
        <p class="card-text fs-6 text-secondary-emphasis text-center">
          ⚡ Click Level Up to increase • Max = 6
        </p>
        
        <div class="d-flex justify-content-center mt-3 mb-4">
          <button id="levelUpBtn" class="btn btn-success px-5 py-2 fw-bold">
            🚀 Level Up
          </button>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-2">
          <a href="level2.html" class="btn btn-secondary px-4">← Back</a>
          
          <a href="level4.html" class="btn btn-primary px-4">Next →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="Level3.js"></script>
</body>
</html>
