<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="level4.css">
  <title>Level 4 </title>
  
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card" style="max-width: 32rem; width: 100%;">
      <span class="badge text-bg-primary position-absolute top-0 start-0 m-3" id="levelBadge">Level 4</span>
      
      <div class="card-body pt-5 mt-2">  
        <h2 class="card-title text-center fw-semibold">Web Dev Mini-Quest</h2>
        <hr class="my-3">
        
        <p class="card-text fs-5 text-center fw-bold">
          📝 Form Validation
        </p>
        
        <p class="card-text fs-6 text-secondary-emphasis text-center mb-4">
          Enter your name • Submit • See validation
        </p>
        
        <div class="px-2">
          <div class="mb-3">
            <label for="nameInput" class="form-label fw-semibold">Your Name:</label>
            <input type="text" class="form-control form-control-lg" id="nameInput" placeholder="e.g., Juan Dela Cruz">
          </div>
          
          <div class="d-grid gap-2 mb-3">
            <button id="submitBtn" class="btn btn-warning fw-bold py-2">
              ✅ Submit Name
            </button>
          </div>
          

          <div id="messageArea" class="mt-3 text-center fw-semibold p-3 rounded">
          </div>
        </div>
        

        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="level3.html" class="btn btn-secondary px-4">← Back</a>
          <a href="level5.html" class="btn btn-primary px-4">Next →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="level4.js"></script>
</body>
</html>
