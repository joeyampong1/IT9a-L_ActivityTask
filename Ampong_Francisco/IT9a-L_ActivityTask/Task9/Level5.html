<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="level5.css">
  
  <title>Level 5</title>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card" style="max-width: 32rem; width: 100%;">
      <span class="badge text-bg-primary position-absolute top-0 start-0 m-3" id="levelBadge">Level 5</span>
      
      <div class="card-body pt-5 mt-2">  
        <h2 class="card-title text-center fw-semibold">Web Dev Mini-Quest</h2>
        <hr class="my-3">
        
        <p class="card-text fs-5 text-center fw-bold">
          🪙 Coin Counter
        </p>
        
        <p class="card-text fs-6 text-secondary-emphasis text-center mb-4">
          Press + to add • Press - to subtract (min 0)
        </p>
        
        <!-- ===== COIN COUNTER SECTION ===== -->
        <div class="text-center">
          <div class="coin-display mb-3">
            <span id="coinIcon" class="fs-1">🪙</span>
            <div class="coin-count-container">
              <span id="coinCount" class="coin-count">0</span>
            </div>
          </div>
          
          <div class="d-flex justify-content-center gap-4 mb-4">
            <button id="decreaseBtn" class="btn btn-counter btn-decrease">
              <span class="fs-2">−</span>
            </button>
            
            <button id="increaseBtn" class="btn btn-counter btn-increase">
              <span class="fs-2">+</span>
            </button>
          </div>
          
          <!-- Coin Status Message -->
          <div id="coinMessage" class="mt-2 fst-italic text-secondary">
            You have 0 coins
          </div>
        </div>
        
        <!--  buttons -->
        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="level4.html" class="btn btn-secondary px-4">← Back</a>
          <a href="level6.html" class="btn btn-primary px-4">Next →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="level5.js"></script>
</body>
</html>
