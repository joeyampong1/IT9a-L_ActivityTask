<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="level6.css">
  <title>Level 6 </title>

</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card" style="max-width: 35rem; width: 100%;">
      <span class="badge text-bg-primary position-absolute top-0 start-0 m-3" id="levelBadge">Level 6</span>
      
      <div class="card-body pt-5 mt-2">  
        <h2 class="card-title text-center fw-semibold">Web Dev Mini-Quest</h2>
        <hr class="my-3">
        
        <p class="card-text fs-5 text-center fw-bold">
          🚪 Door Challenge · Conditionals
        </p>
        
        <p class="card-text fs-6 text-secondary-emphasis text-center mb-4">
          Only 1 door is correct • Choose wisely!
        </p>
        
        <!-- ===== DOOR CHALLENGE SECTION ===== -->
        <div class="doors-container text-center mb-4">
          <!-- 3 Doors -->
          <div class="row g-3 justify-content-center">
            <!-- Door 1 -->
            <div class="col-4">
              <button id="door1" class="btn door-btn door-1">
                <div class="door-icon">🚪</div>
                <div class="door-number">Door #1</div>
              </button>
            </div>
            
            <!-- Door 2 -->
            <div class="col-4">
              <button id="door2" class="btn door-btn door-2">
                <div class="door-icon">🚪</div>
                <div class="door-number">Door #2</div>
              </button>
            </div>
            
            <!-- Door 3 -->
            <div class="col-4">
              <button id="door3" class="btn door-btn door-3">
                <div class="door-icon">🚪</div>
                <div class="door-number">Door #3</div>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Message Area (Success / Error) -->
        <div id="doorMessage" class="mt-3 text-center fw-semibold p-3 rounded">
        </div>
        
        <!-- Result Details (Optional) -->
        <div id="resultDetails" class="text-center mt-2 small">
        </div>
        
        <!-- buttons -->
        <div class="d-flex justify-content-between align-items-center mt-4">
          <a href="level5.html" class="btn btn-secondary px-4">← Back</a>
          <a href="level1.html" id="restartBtn" class="btn btn-danger px-4">
            🔄 Restart
          </a>
        </div>
        
        <!-- Hidden field to store correct door (set by JS) -->
        <div id="correctDoor" style="display: none;">2</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="level6.js"></script>
</body>
</html>
